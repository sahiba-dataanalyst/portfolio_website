    <style>
        /* ----- RESET & GLOBAL ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --primary: #0f2b4b;
            --accent: #1e6b9e;
            --text: #1e293b;
            --text-light: #475569;
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02);
            --shadow-hover: 0 20px 40px -10px rgba(15, 43, 75, 0.15), 0 8px 15px -6px rgba(0,0,0,0.05);
        }

        body {
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ----- TYPOGRAPHY ----- */
        h1, h2, h3 {
            font-weight: 600;
            line-height: 1.2;
            color: var(--primary);
        }

        h1 { font-size: 2.2rem; }
        h2 { font-size: 1.8rem; margin-bottom: 1.5rem; border-left: 5px solid var(--accent); padding-left: 1rem; }
        h3 { font-size: 1.3rem; color: var(--accent); margin-bottom: 0.5rem; }

        a {
            color: var(--accent);
            text-decoration: none;
            transition: 0.2s;
        }
        a:hover { color: var(--primary); text-decoration: underline; }

        /* ----- LAYOUT ----- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem;
            flex: 1;
            width: 100%;
        }

        /* ----- HEADER / NAV ----- */
        .navbar {
            background: var(--surface);
            box-shadow: var(--shadow);
            padding: 0.8rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            transition: box-shadow 0.3s;
        }

        .navbar:hover {
            box-shadow: 0 8px 30px -8px rgba(15, 43, 75, 0.12);
        }

        .logo a {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: -0.5px;
            transition: 0.2s;
        }
        .logo a:hover {
            text-decoration: none;
            transform: scale(1.02);
        }
        .logo a span { color: var(--accent); }

        .nav-links {
            display: flex;
            gap: 1.8rem;
            list-style: none;
            flex-wrap: wrap;
        }

        .nav-links a {
            font-weight: 500;
            color: var(--text-light);
            padding: 0.5rem 0;
            border-bottom: 2px solid transparent;
            text-decoration: none;
            transition: color 0.2s, border-color 0.2s;
            position: relative;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: var(--primary);
            border-bottom-color: var(--accent);
            text-decoration: none;
        }

        .menu-toggle {
            display: none;
            font-size: 1.8rem;
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .menu-toggle:hover {
            transform: scale(1.1);
        }

        /* ----- CARDS & COMPONENTS ----- */
        .card {
            background: var(--surface);
            border-radius: 1.2rem;
            padding: 2rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
            border-color: var(--accent);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.8rem;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .badge {
            background: var(--accent);
            color: white;
            font-size: 0.75rem;
            padding: 0.25rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            letter-spacing: 0.3px;
            transition: transform 0.2s, background 0.2s;
        }
        .badge:hover {
            transform: scale(1.05);
            background: var(--primary);
        }

        .tag {
            background: #eef2f6;
            color: var(--primary);
            padding: 0.3rem 1rem;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-block;
            margin: 0.25rem;
            transition: 0.2s;
        }
        .tag:hover {
            background: var(--accent);
            color: white;
        }

        .skill-tag {
            background: white;
            border: 1px solid var(--border);
            padding: 0.4rem 1rem;
            border-radius: 30px;
            font-size: 0.9rem;
            display: inline-block;
            margin: 0.3rem;
            transition: 0.25s ease;
            cursor: default;
        }
        .skill-tag:hover {
            border-color: var(--accent);
            background: #f0f7ff;
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 4px 12px rgba(30, 107, 158, 0.12);
        }

        .progress-item {
            margin-bottom: 1.2rem;
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            font-weight: 500;
            margin-bottom: 0.3rem;
        }
        .progress-bar-bg {
            height: 8px;
            background: #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 20px;
            width: 0%;
            transition: width 0.8s ease;
        }

        /* ----- PAGE SPECIFIC ----- */
        .hero {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 2.5rem;
            margin: 2rem 0 1rem;
        }
        .hero-content {
            flex: 2;
            min-width: 280px;
        }
        .hero-content h1 {
            font-size: 2.8rem;
            margin-bottom: 1rem;
        }
        .hero-content p {
            font-size: 1.2rem;
            color: var(--text-light);
            margin-bottom: 2rem;
        }
        .hero-avatar {
            flex: 1;
            min-width: 200px;
            display: flex;
            justify-content: center;
        }
        .avatar-circle {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 4.5rem;
            font-weight: 700;
            box-shadow: var(--shadow);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        .avatar-circle:hover {
            transform: scale(1.05) rotate(3deg);
            box-shadow: 0 25px 40px -12px rgba(15, 43, 75, 0.4);
        }

        .btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 40px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: 0.25s ease;
        }
        .btn:hover {
            background: var(--accent);
            color: white;
            text-decoration: none;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px -8px rgba(30, 107, 158, 0.5);
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            margin-left: 1rem;
        }
        .btn-outline:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px -8px rgba(15, 43, 75, 0.4);
        }

        .list-item {
            padding: 1rem 0;
            border-bottom: 1px solid var(--border);
            transition: background 0.25s, padding-left 0.25s;
            border-radius: 8px;
        }
        .list-item:hover {
            background: #f8fafc;
            padding-left: 0.8rem;
        }
        .list-item:last-child { border-bottom: none; }

        .meta {
            font-size: 0.9rem;
            color: var(--text-light);
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin: 0.3rem 0 0.6rem;
        }

        /* Contact info hover */
        .contact-item {
            padding: 0.6rem 0.8rem;
            border-radius: 10px;
            transition: background 0.25s, transform 0.25s;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .contact-item:hover {
            background: #f0f7ff;
            transform: translateX(6px);
        }

        /* ----- FOOTER ----- */
        footer {
            background: var(--surface);
            border-top: 1px solid var(--border);
            text-align: center;
            padding: 1.5rem;
            color: var(--text-light);
            font-size: 0.9rem;
            margin-top: 2rem;
            transition: background 0.3s;
        }
        footer:hover {
            background: #f0f4f9;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            h2 { font-size: 1.6rem; }
            .navbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.8rem;
            }
            .menu-toggle {
                display: block;
                position: absolute;
                right: 1.5rem;
                top: 1rem;
            }
            .nav-links {
                display: none;
                flex-direction: column;
                width: 100%;
                gap: 0.5rem;
                padding-top: 0.5rem;
            }
            .nav-links.show {
                display: flex;
            }
            .nav-links li {
                width: 100%;
            }
            .nav-links a {
                display: block;
                padding: 0.6rem 0;
            }
            .hero-content h1 { font-size: 2.2rem; }
            .hero-avatar .avatar-circle {
                width: 150px;
                height: 150px;
                font-size: 3.5rem;
            }
            .btn-outline { margin-left: 0; margin-top: 0.8rem; }
            .card { padding: 1.5rem; }
        }

        @media (max-width: 480px) {
            .container { padding: 1rem; }
            .hero-content h1 { font-size: 1.8rem; }
            .avatar-circle {
                width: 120px;
                height: 120px;
                font-size: 3rem;
            }
        }

        /* ----- UTIL ----- */
        .mt-2 { margin-top: 1.5rem; }
        .mb-1 { margin-bottom: 0.8rem; }
        .text-center { text-align: center; }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .page {
            animation: fade 0.3s ease;
        }
        @keyframes fade {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }
        .icon-circle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            color: var(--accent);
            transition: transform 0.25s;
        }
        .contact-item:hover .icon-circle {
            transform: scale(1.15);
        }
    </style>
</head>

    };

    // ---------- ROUTER ----------
    const app = document.getElementById('app');
    const navLinks = document.querySelectorAll('.nav-links a');
    const menuToggle = document.getElementById('menuToggle');
    const navUl = document.getElementById('navLinks');

    function navigate(pageId) {
        navLinks.forEach(link => {
            link.classList.remove('active');
            if (link.dataset.page === pageId) link.classList.add('active');
        });

        const page = pages[pageId];
        if (page) {
            app.innerHTML = page.render();
            document.title = page.title + ' | Portfolio';
            if (pageId === 'contact') {
                const form = document.getElementById('contactForm');
                if (form) {
                    form.addEventListener('submit', (e) => {
                        e.preventDefault();
                        document.getElementById('formFeedback').textContent = '✅ Message sent! (demo)';
                        form.reset();
                    });
                }
            }
        } else {
            app.innerHTML = '<h1>404 – Page not found</h1>';
        }

        navUl.classList.remove('show');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('click', (e) => {
        const link = e.target.closest('a[data-page]');
        if (link) {
            e.preventDefault();
            const page = link.dataset.page;
            if (page && pages[page]) {
                navigate(page);
                history.pushState({}, '', `#${page}`);
            }
        }
    });

    menuToggle.addEventListener('click', () => {
        navUl.classList.toggle('show');
    });

    window.addEventListener('load', () => {
        const hash = window.location.hash.slice(1) || 'home';
        if (pages[hash]) {
            navigate(hash);
        } else {
            navigate('home');
        }
    });

    window.addEventListener('hashchange', () => {
        const hash = window.location.hash.slice(1) || 'home';
        if (pages[hash]) {
            navigate(hash);
        }
    });

    document.querySelectorAll('a[href="#"]').forEach(a => {
        a.addEventListener('click', (e) => e.preventDefault());
    });
</script>
</body>
</html>
